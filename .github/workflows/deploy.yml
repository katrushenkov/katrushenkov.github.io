name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy by hand from the Actions tab without pushing.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Pinned to the version used locally. Bump deliberately.
      HUGO_VERSION: 0.167.0
      # The theme's SCSS is compiled with Dart Sass (see layouts/partials/head.html).
      # Stay on 1.x: the theme relies on @import, which Dart Sass 3.0 removes.
      DART_SASS_VERSION: 1.105.1
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Install Dart Sass
        run: |
          wget -O "${{ runner.temp }}/dart-sass.tar.gz" \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -C "${{ runner.temp }}" -xf "${{ runner.temp }}/dart-sass.tar.gz"
          echo "${{ runner.temp }}/dart-sass" >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The theme is a git submodule — without this the build has no layouts.
          submodules: recursive
          # Full history, so .Lastmod and enableGitInfo work if you turn them on.
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
