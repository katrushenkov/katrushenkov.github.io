  [[params.social]]
    name = "twitter"
    url  = "https://twitter.com/katrushenkov"

  [[params.social]]
    name = "email"
    url  = "mailto:katrushenkov@_gmail_.com"

  [[params.social]]
    name = "github"
    url  = "https://github.com/katrushenkov"

  [[params.social]]
    name = "linkedin"
    url  = "https://www.linkedin.com/in/katrushenkov/"

  [[params.social]]
    name = "stackoverflow"
    url  = "https://www.stackoverflow.com/users/14194919/katrushenkov"

  [[params.social]]
    name = "telegram"
    url  = "https://t.me/katrushenkov"
	
