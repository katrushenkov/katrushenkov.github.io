baseURL = "https://katrushenkov.github.io"
title   = "Personal blog"
locale  = "en-us"
theme   = "hello-friend-ng"

copyright = "This work is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License." # This message is only used by the RSS template.

archetypeDir = "archetypes"
contentDir   = "content"
dataDir      = "data"
layoutDir    = "layouts"
publishDir   = "public"

buildDrafts  = false
buildFuture  = false
buildExpired = false

# Strip accents from generated URLs, so "Débuter avec Hugo" -> /debuter-avec-hugo/
# instead of a path with non-ASCII characters.
removePathAccents = true

enableRobotsTXT = true
enableGitInfo   = false
enableEmoji     = true
enableMissingTranslationPlaceholders = false
disableHugoGeneratorInject = false

# To switch off a whole page kind, list it here, e.g.
# disableKinds = ["taxonomy", "term"]

[pagination]
  disableAliases = false
  pagerSize = 20
  path = 'page'

[services]
  [services.rss]
      # Maximum number of items in the RSS feed.
      limit = 42
      
#   [services.disqus]
#     shortname = 'your-disqus-shortname'
#   [services.googleAnalytics]
#     ID = 'G-MEASUREMENT_ID'

# No [permalinks] block on purpose.
#
# Hugo's default URL is the content file path, which is exactly what we want:
#   content/posts/20220606-test-port.md        -> /posts/20220606-test-port/
#   content/blog/20241024-template.md          -> /blog/20241024-template/
#   content/posts/linux/bash/20200104-test.md  -> /posts/linux/bash/20200104-test/
#
# Date lives in the file name, and nested folders keep their hierarchy.
# A page can still override its own URL with `slug` or `url` in front matter.

[taxonomies]
  tag      = "tags"
  category = "categories"
  series   = "series"

[markup]
  # Replaces the removed [blackfriday] block. Blackfriday was dropped in Hugo 0.60;
  # Goldmark handles Markdown now.
  [markup.goldmark.renderer]
    # Set to true if you need to write raw HTML inside Markdown.
    unsafe = false
  [markup.highlight]
    # Replaces the legacy PygmentsCodeFences / PygmentsStyle keys.
    style       = "monokai"
    codeFences  = true
    guessSyntax = true
    noClasses   = true
    lineNos     = false
  [markup.tableOfContents]
    # Content headings should start at "##" — "#" is already rendered as the post title.
    startLevel = 2
    endLevel   = 4

# Powers "Related posts". Hugo scores pages by shared tags/series/date;
# rendered by layouts/partials/related.html.
[related]
  includeNewer = true
  threshold    = 80
  toLower      = true

  [[related.indices]]
    name   = "tags"
    weight = 100
  [[related.indices]]
    name   = "series"
    weight = 80
  [[related.indices]]
    name   = "categories"
    weight = 60
  [[related.indices]]
    name   = "date"
    weight = 10

[params]
  dateform        = "Jan 2, 2006"
  dateformShort   = "Jan 2"
  dateformNum     = "2006-01-02"
  dateformNumTime = "2006-01-02 15:04"

  # Metadata mostly used in document's head
  #
  description = "Personal blog"
  keywords = ""
  images = [""]

  # Home subtitle of the index page.
  #
  homeSubtitle = "Personal blog"

  # Set a background for the homepage
  # backgroundImage = "assets/images/background.jpg"

  # Prefix of link to the git commit detail page. GitInfo must be enabled.
  #
  # gitUrl = ""

  # Set disableReadOtherPosts to true in order to hide the links to other posts.
  #
  disableReadOtherPosts = false

  # Heading shown above the previous/next post buttons.
  #
  readOtherPosts = "Read other posts"

  # Enable theme toggle
  #
  # This options enables the theme toggle for the theme.
  # Per default, this option is off.
  # The theme is respecting the prefers-color-scheme of the operating system.
  # With this option on, the page user is able to set the scheme he wants.
  enableThemeToggle = true

  # Sharing buttons
  #
  # There are a lot of buttons preconfigured. If you want to change them,
  # generate the buttons here: https://sharingbuttons.io
  # and add them into your own `layouts/partials/sharing-buttons.html`
  #
  enableSharingButtons = true

  # Global language menu
  #
  # Enables the global language menu.
  #
  enableGlobalLanguageMenu = false

  # Integrate Javascript files or stylesheets by adding the url to the external assets or by
  # linking local files with their path relative to the static folder, e.g. "css/styles.css"
  #
  customCSS = []
  customJS  = []

  # Toggle this option need to rebuild SCSS, requires extended version of Hugo
  #
  justifyContent = false  # Set "text-align: justify" to .post-content.

  # Integrate Plausible.io
  # plausibleDataDomain = 'test.com'
  # plausibleScriptSource = 'https://plausible.io/js/script.js'
  
  # Default theme "light" or "dark"
  #
  defaultTheme = "dark"
  themeColor = "#252627"

  [params.author]
    name = "Sergey Katrushenkov"

  # Custom footer
  # If you want, you can easily override the default footer with your own content.
  #
  [params.footer]
    trademark = 2026
    rss = false
    copyright = false
    author = true

    topText = []
#    bottomText = [
#      "Powered by <a href=\"http://gohugo.io\">Hugo</a>",
#      "Made with &#10084; by <a href=\"https://github.com/katrushenkov\">Sergey Katrushenkov</a>"
#    ]

  # Colors for favicons
  #
  [params.favicon.color]
    mask = "#1b1c1d"
    msapplication = "#1b1c1d"
    theme = "#1b1c1d"

  [params.logo]
    logoMark     = ">"
    logoText     = "$ cd /home/"
    logoHomeLink = "/"
    # Set true to remove the logo cursor entirely.
    # logoCursorDisabled = false
    # Set to a valid CSS color to change the cursor in the logo.
    # logoCursorColor    = "#67a2c9"
    # Set to a valid CSS time value to change the animation duration, "0s" to disable.
    # logoCursorAnimate  = "2s"
    # Append the current url pathname to logoText
    # logoCursorPathname = true

