# # # # # # # # # # # # # # # # # # # # # # # # # # # # #
# Menu
# # # # # # # # # # # # # # # # # # # # # # # # # # # # #
# IMPORTANT: this theme sorts the menu by `identifier`, not by `weight`
# (see themes/hello-friend-ng/layouts/partials/menu.html: `sort .Site.Menus.main ".Identifier"`).
# So `weight` does nothing here — control the order with the numeric prefix
# in `identifier`. Numbers are spaced by 10 to leave room for new entries.
#
# Entries with a `parent` become a dropdown submenu.
[menu]
  [[menu.main]]
    identifier = "10-posts"
    name       = "Posts"
    url        = "/posts/"

  [[menu.main]]
    identifier = "20-blog"
    name       = "Blog"
    url        = "/blog/"

  [[menu.main]]
    identifier = "80-tags"
    name       = "Tags"
    url        = "/tags/"

  [[menu.main]]
    identifier = "90-about"
    name       = "About"
    url        = "/about/"

# Example of a dropdown submenu — uncomment and adapt when you add more sections:
